<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicketFlow — Panel de administracion</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="admin-body">
  <div class="bg-glow"></div>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="admin.html" class="brand">
        <img src="img/logo.png" alt="TicketFlow" width="42" height="42" style="border-radius:10px;">
        <div>
          <strong>TicketFlow</strong>
          <small>Panel admin</small>
        </div>
      </a>

      <nav class="admin-nav">
        <button class="admin-nav-btn active" data-panel="dashboard">Dashboard</button>
        <button class="admin-nav-btn" data-panel="usuarios">Usuarios</button>
        <button class="admin-nav-btn" data-panel="eventos">Eventos</button>
        <button class="admin-nav-btn" data-panel="ventas">Ventas</button>
      </nav>

      <div class="admin-sidebar-footer">
        <div class="user-menu compact">
          <div class="avatar sm has-photo" id="admin-avatar-wrap">
            <img id="admin-avatar-img" src="img/perfiles/admin.jpg" alt="Admin" loading="lazy">
            <span id="admin-avatar">A</span>
          </div>
          <div class="user-info">
            <strong id="admin-name">Admin</strong>
            <small id="admin-role">admin</small>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm btn-block" id="logout-btn">Cerrar sesion</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <div>
          <h1 id="panel-title">Dashboard</h1>
          <p id="panel-subtitle">Resumen general de la plataforma</p>
        </div>
        <span class="status-pill ok">Vista administrador</span>
      </header>

      <section id="panel-dashboard" class="admin-panel active">
        <div class="metrics-grid" id="metrics-grid">
          <div class="metric-card skeleton">Cargando...</div>
        </div>
        <div class="admin-grid-2">
          <div class="admin-card">
            <h3>Boletos por estado</h3>
            <div id="boletos-chart" class="chart-bars"></div>
          </div>
          <div class="admin-card">
            <h3>Ventas recientes</h3>
            <div id="ventas-recientes" class="table-wrap"></div>
          </div>
        </div>
      </section>

      <section id="panel-usuarios" class="admin-panel">
        <div class="admin-card">
          <h3>Usuarios registrados</h3>
          <div id="usuarios-table" class="table-wrap"></div>
        </div>
      </section>

      <section id="panel-eventos" class="admin-panel">
        <div class="admin-card">
          <h3>Eventos en plataforma</h3>
          <div id="eventos-table" class="table-wrap"></div>
        </div>
      </section>

      <section id="panel-ventas" class="admin-panel">
        <div class="admin-card">
          <h3>Historial de ventas</h3>
          <div id="ventas-table" class="table-wrap"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/images.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
