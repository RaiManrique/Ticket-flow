<article class="trend-card" [class.featured]="featured">
  <div class="trend-poster" [ngClass]="coverClass(evento.categoria)">
    <img class="trend-poster-img" [src]="flyer(evento)" [alt]="evento.titulo" loading="lazy">
    <div class="trend-badges">
      <span class="badge-cat" [ngClass]="evento.categoria">{{ categoryLabel[evento.categoria] || evento.categoria }}</span>
      <span class="badge-fans">{{ fansLabel(evento.asistentes?.length || 0) }}</span>
    </div>
    <button class="event-fav-btn" [class.active]="favorite" type="button" (click)="toggleFavorite.emit(evento)" aria-label="Favorito">
      {{ favorite ? '★' : '☆' }}
    </button>
  </div>
  <div class="trend-body">
    <h3>{{ evento.titulo }}</h3>
    <p class="trend-meta">{{ evento.ciudad }} · {{ formatDateCard(evento.fecha_evento) }}</p>
    <p class="trend-desc">{{ evento.descripcion || 'Evento en la comunidad TicketFlow.' }}</p>
    <div class="event-actions">
      <button class="link-btn" type="button" (click)="detail.emit(evento)">Ver detalle</button>
      <button class="link-btn" type="button" (click)="share.emit(evento)">Compartir</button>
    </div>
    <div class="trend-footer">
      <span class="status-live">• EN CATALOGO</span>
    </div>
  </div>
</article>
