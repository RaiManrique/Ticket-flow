<div class="bg-glow"></div>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <a routerLink="/admin" class="brand">
      <img src="/img/logo.png" alt="TicketFlow" width="42" height="42" style="border-radius:10px;">
      <div><strong>TicketFlow</strong><small>Panel admin</small></div>
    </a>
    <nav class="admin-nav">
      <a class="admin-nav-btn" routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
      <a class="admin-nav-btn" routerLink="/admin/usuarios" routerLinkActive="active">Usuarios</a>
      <a class="admin-nav-btn" routerLink="/admin/eventos" routerLinkActive="active">Eventos</a>
      <a class="admin-nav-btn" routerLink="/admin/ventas" routerLinkActive="active">Ventas</a>
      <a class="admin-nav-btn" routerLink="/admin/reembolsos" routerLinkActive="active">Reembolsos</a>
    </nav>
    <div class="admin-sidebar-footer">
      <div class="user-info">
        <strong>{{ user.nombre_completo || user.username }}</strong>
        <small>{{ roleLabel(user.rol) }}</small>
      </div>
      <button class="btn btn-ghost btn-sm btn-block" type="button" (click)="logout()">Cerrar sesion</button>
    </div>
  </aside>
  <main class="admin-main">
    <router-outlet />
  </main>
</div>
