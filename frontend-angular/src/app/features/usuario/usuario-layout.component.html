<div class="bg-glow"></div>
<div class="neon-lines" aria-hidden="true"></div>

<header class="app-header app-header--full">
  <a routerLink="/usuario/inicio" class="brand-logo">
    <img src="/img/logo.png" alt="TicketFlow" width="40" height="40">
  </a>
  <nav class="app-nav" aria-label="Navegación principal">
    <a class="app-nav-btn" routerLink="/usuario/inicio" routerLinkActive="active">Inicio</a>
    <a class="app-nav-btn" routerLink="/usuario/eventos" routerLinkActive="active">Eventos</a>
    <a class="app-nav-btn" routerLink="/usuario/comunidad" routerLinkActive="active">Comunidad</a>
    <a class="app-nav-btn" routerLink="/usuario/perfil" routerLinkActive="active">Perfil</a>
  </nav>
  <div class="app-header-actions">
    <div class="user-chip">
      <div class="avatar sm has-photo">
        <img [src]="photo()" [alt]="user.nombre_completo || user.username" loading="lazy">
        <span>{{ initials() }}</span>
      </div>
      <span>{{ firstName() }}</span>
    </div>
    <button class="btn btn-ghost btn-sm" type="button" (click)="logout()">Salir</button>
  </div>
</header>

<main class="app-main">
  <router-outlet />
</main>

<nav class="app-mobile-nav" aria-label="Navegación móvil">
  <a routerLink="/usuario/inicio" routerLinkActive="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg>
    Inicio
  </a>
  <a routerLink="/usuario/eventos" routerLinkActive="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    Eventos
  </a>
  <a routerLink="/usuario/comunidad" routerLinkActive="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    Social
  </a>
  <a routerLink="/usuario/perfil" routerLinkActive="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
    Perfil
  </a>
</nav>

<footer class="app-footer">
  <div class="app-footer-inner">
    <span>TicketFlow Perú — red social de eventos</span>
    <div class="app-footer-links">
      <a routerLink="/usuario/comunidad">Comunidad</a>
    </div>
  </div>
</footer>
