services:
  mongo:
    image: mongo:8.3.3-noble
    container_name: TicketFlow-Mongo
    restart: always
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    ports:
      - "${MONGO_BIND_IP}:${MONGO_PORT}:27017"
    volumes:
      - ./BD:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - ./z-init-app-user.sh:/docker-entrypoint-initdb.d/z-init-app-user.sh:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ticketflow-data

  api:
    build: ./backend
    container_name: TicketFlow-API
    restart: always
    env_file:
      - .env
    environment:
      PORT: 3000
      MONGO_HOST: mongo
      MONGO_INTERNAL_PORT: 27017
      MONGO_DATABASE: ticketflow_social
      MONGO_USE_APP_USER: ${MONGO_USE_APP_USER:-false}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ticketflow-data

  web:
    image: nginx:1.27-alpine
    container_name: TicketFlow-Web
    restart: always
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - ticketflow-data

networks:
  ticketflow-data:
    driver: bridge
