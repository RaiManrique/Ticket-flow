# Uso: git clone → docker compose up -d --build
# Si el login falla con 502: docker compose up -d --force-recreate

name: ticket-flow

x-ticketflow-labels: &ticketflow-labels
  com.ticketflow.project: ticketflow
  com.ticketflow.environment: development

services:
  mongo:
    image: mongo:8.3.3-noble
    container_name: TicketFlow-Mongo
    restart: unless-stopped
    labels:
      <<: *ticketflow-labels
      com.ticketflow.layer: datos
      com.ticketflow.service: mongodb
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-ticketflow_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-TicketFlow2026DevMongo!}
      MONGO_APP_USER: ${MONGO_APP_USER:-ticketflow_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-TicketFlow2026DevApp!}
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - ./BD:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - ./z-init-app-user.sh:/docker-entrypoint-initdb.d/z-init-app-user.sh:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ticketflow-data

  api:
    build: ./backend
    container_name: TicketFlow-API
    restart: unless-stopped
    labels:
      <<: *ticketflow-labels
      com.ticketflow.layer: aplicacion
      com.ticketflow.service: api
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      MONGO_HOST: mongo
      MONGO_INTERNAL_PORT: 27017
      MONGO_DATABASE: ticketflow_social
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-ticketflow_admin}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-TicketFlow2026DevMongo!}
      MONGO_USE_APP_USER: ${MONGO_USE_APP_USER:-false}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-TicketFlow2026}
      JWT_SECRET: ${JWT_SECRET:-ticketflow-dev-secret-cambiar-en-produccion}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8090,http://localhost:8090,http://127.0.0.1:4200,http://localhost:4200}
      MAX_BOLETOS_POR_EVENTO: ${MAX_BOLETOS_POR_EVENTO:-4}
      TICKET_VENDOR: ${TICKET_VENDOR:-TicketFlow Perú}
      REFUND_MAX_DAYS: ${REFUND_MAX_DAYS:-30}
      REFUND_MIN_HOURS_BEFORE_EVENT: ${REFUND_MIN_HOURS_BEFORE_EVENT:-48}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ticketflow-data

  web:
    build: ./frontend-angular
    container_name: TicketFlow-Web
    restart: unless-stopped
    labels:
      <<: *ticketflow-labels
      com.ticketflow.layer: presentacion
      com.ticketflow.service: frontend
    ports:
      - "8090:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ticketflow-data

networks:
  ticketflow-data:
    driver: bridge
    name: ticketflow-data
